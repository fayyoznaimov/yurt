# Каталог без компьютера владельца: GitHub Actions собирает магазины параллельно (каждый в своей задаче),
# затем одна задача пересобирает сайт и публикует его в ветку gh-pages. Память между запусками — зашифрованный
# архив в ветке `data` (datastore.py): сырые данные магазинов, выдача и проверенные размеры Trendyol / escarpe.
# YOOX здесь НЕ собирается: товары YOOX берутся из последнего импорта (python push_yoox.py --github).
#
# По расписанию работает, только если в Settings → Secrets and variables → Actions → Variables есть переменная
# RUN_IN_ACTIONS = true. Ручной запуск (Actions → «Каталог: обновление» → Run workflow) — всегда.
# Нужен секрет DATA_KEY (ключ шифрования, python datastore.py init-key). Необязательно: TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID — уведомления о сбоях.
name: "Каталог: обновление"

on:
  schedule:
    - cron: "5 */3 * * *"           # каждые 3 часа (05:05, 08:05, … по Ташкенту, UTC+5); GitHub может задержать на 5–20 мин
  workflow_dispatch:
    inputs:
      mode:
        description: "full — собрать магазины; offline — только пересобрать сайт из сохранённых данных"
        type: choice
        options: [full, offline]
        default: full
      accept_drop:
        description: "Принять резкое падение числа товаров (распродажа правда закончилась)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - config.json
      - site/index.html
      - site/content.json
      - site/brands.json
      - site/img/brands/**
      - describe.py
      - pricing.py
      - run.py
      - catalog_files.py
      - sync_state.py

permissions:
  contents: write     # ветки data и gh-pages
  actions: write      # не дать GitHub выключить расписание (последний шаг)

concurrency:
  group: catalog-update
  cancel-in-progress: false

env:
  TZ: Asia/Tashkent
  PYTHONUTF8: "1"
  YURT_NAME: github-actions

jobs:
  # ---------- сбор: каждый магазин в своей задаче, все одновременно ----------
  collect:
    if: >-
      (github.event_name == 'schedule' && vars.RUN_IN_ACTIONS == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false               # один магазин упал — остальные собираются и публикуются
      matrix:
        include:
          - src: pcardin_tr
            files: "data/raw_pcardin_tr.json data/raw_pcardin_tr.meta.json data/akinon_pcardin_tr.json"
          - src: cacharel_tr
            files: "data/raw_cacharel_tr.json data/raw_cacharel_tr.meta.json data/akinon_cacharel_tr.json"
          - src: trendyol
            files: "data/raw_trendyol.json data/raw_trendyol.meta.json data/trendyol_listing.json data/trendyol_pdp_cache.json"
          - src: escarpe_it
            files: "data/raw_escarpe_it.json data/raw_escarpe_it.meta.json data/escarpe_listing.json data/escarpe_pdp_cache.json"
    env:
      DATA_KEY: ${{ secrets.DATA_KEY }}
    steps:
      - name: Проверка секрета DATA_KEY
        run: |
          if [ -z "$DATA_KEY" ]; then
            echo "::error title=Нет DATA_KEY::Добавьте секрет DATA_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Опубликованный сайт (ветка gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _pages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet requests
      - name: Память каталога из ветки data
        run: python datastore.py pull --site-from _pages --no-backup
      - name: Сбор ${{ matrix.src }}
        run: python run.py --collect-only --only ${{ matrix.src }} ${{ inputs.accept_drop == true && '--accept-drop' || '' }}
      - name: Собранные файлы → следующей задаче
        if: always()
        run: |
          mkdir -p _out/data
          for f in ${{ matrix.files }}; do [ -f "$f" ] && cp "$f" _out/data/ || true; done
          ls -la _out/data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collected-${{ matrix.src }}
          path: _out/data/
          retention-days: 2
          if-no-files-found: ignore

  # ---------- сборка сайта и публикация ----------
  publish:
    needs: collect
    if: >-
      always() && (
        (github.event_name == 'schedule' && vars.RUN_IN_ACTIONS == 'true') ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && vars.RUN_IN_ACTIONS == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_KEY: ${{ secrets.DATA_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Проверка секрета DATA_KEY
        run: |
          if [ -z "$DATA_KEY" ]; then
            echo "::error title=Нет DATA_KEY::Добавьте секрет DATA_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Опубликованный сайт (ветка gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _pages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet requests
      - name: Имя для коммитов
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Память каталога из ветки data
        run: python datastore.py pull --site-from _pages --no-backup
      - name: Свежесобранное от магазинов поверх памяти
        if: needs.collect.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: collected-*
          path: data/
          merge-multiple: true
      - name: Сборка сайта
        run: python run.py --offline
      - name: Сводка по источникам
        if: always()
        run: python datastore.py summary
      - name: Уведомить о сломавшихся источниках
        run: python notify.py --check
      - name: Сохранить память в ветку data
        run: python datastore.py push --by ci
      - name: Страховка — каталог не уменьшился резко
        # устарели файлы YOOX, источник отдал пустоту и т. п.: опубликованный сайт остаётся прежним
        if: inputs.accept_drop != true
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          def count(p):
              try: return int(json.loads(Path(p).read_text(encoding="utf-8"))["count"])
              except Exception: return None
          new, old = count("site/data/manifest.json"), count("_pages/data/manifest.json")
          print(f"товаров: опубликовано {old}, собрано {new}")
          if new is None or (old and new < old * 0.8):
              print(f"::error title=Каталог уменьшился::{old} → {new} (больше 20%). Сайт не публикую. "
                    f"Проверьте источники; принять падение — ручной запуск с галочкой accept_drop.")
              sys.exit(1)
          PY
      - name: Опубликовать сайт (gh-pages)
        run: python deploy.py --out _pages
      - name: Уведомить о сбое запуска
        if: failure()
        run: python notify.py "Сбой запуска GitHub Actions — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
      - name: Не дать GitHub выключить расписание
        # в публичном репозитории расписание отключается после 60 дней без активности
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/enable" || true
