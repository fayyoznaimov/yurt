# Каталог без компьютера владельца: GitHub Actions собирает турецкие магазины, пересобирает сайт и публикует его
# в ветку gh-pages. Память между запусками — зашифрованный архив в ветке `data` (datastore.py).
# YOOX здесь НЕ собирается: товары YOOX берутся из последнего импорта (python push_yoox.py --github).
#
# ЗАПАСНОЙ вариант. Основной — свой сервер (server/, README «Свой сервер»). Одновременно оба не включайте:
# по расписанию этот workflow работает, только если в Settings → Secrets and variables → Actions → Variables
# есть переменная RUN_IN_ACTIONS = true. Ручной запуск (Actions → «Каталог: обновление» → Run workflow) — всегда.
# Нужен секрет DATA_KEY (ключ шифрования, python datastore.py init-key). Необязательно: TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID — уведомления о сбоях.
name: "Каталог: обновление"

on:
  schedule:
    - cron: "5 1,7,13,19 * * *"     # каждые 6 часов: 06:05, 12:05, 18:05, 00:05 по Ташкенту (UTC+5)
  workflow_dispatch:
    inputs:
      mode:
        description: "full — собрать магазины Турции; offline — только пересобрать сайт из сохранённых данных"
        type: choice
        options: [full, offline]
        default: full
      accept_drop:
        description: "Принять резкое падение числа товаров (распродажа правда закончилась)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - config.json
      - site/index.html
      - site/content.json
      - site/brands.json
      - site/img/brands/**
      - describe.py
      - pricing.py
      - run.py
      - sync_state.py

permissions:
  contents: write     # ветки data и gh-pages
  actions: write      # не дать GitHub выключить расписание (последний шаг)

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || vars.RUN_IN_ACTIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_KEY: ${{ secrets.DATA_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YURT_NAME: github-actions
      TZ: Asia/Tashkent
      PYTHONUTF8: "1"
      MODE: ${{ github.event_name == 'schedule' && 'full' || (github.event_name == 'push' && 'offline' || inputs.mode) }}
    steps:
      - name: Проверка секрета DATA_KEY
        run: |
          if [ -z "$DATA_KEY" ]; then
            echo "::error title=Нет DATA_KEY::Добавьте секрет DATA_KEY (Settings → Secrets and variables → Actions). См. README, «GitHub Actions»."
            exit 1
          fi

      - name: Код (ветка main)
        uses: actions/checkout@v4

      - name: Опубликованный сайт (ветка gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _pages

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install --quiet requests

      - name: Имя для коммитов
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Память каталога из ветки data
        run: python datastore.py pull --site-from _pages --no-backup

      - name: Сбор магазинов Турции и сборка сайта
        if: env.MODE == 'full'
        run: python update.py --no-deploy ${{ inputs.accept_drop == true && '--accept-drop' || '' }}

      - name: Пересборка сайта без захода в магазины
        if: env.MODE == 'offline'
        run: python run.py --offline

      - name: Сводка по источникам
        if: always()
        run: python datastore.py summary

      - name: Уведомить о сломавшихся источниках
        run: python notify.py --check

      - name: Сохранить память в ветку data
        run: python datastore.py push --by ci

      - name: Опубликовать сайт (gh-pages)
        run: python deploy.py --out _pages

      - name: Уведомить о сбое запуска
        if: failure()
        run: python notify.py "Сбой запуска GitHub Actions: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

      - name: Не дать GitHub выключить расписание
        # в публичном репозитории расписание отключается после 60 дней без активности
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/enable" || true
